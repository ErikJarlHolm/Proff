[project]
name = "proff"
version = "0.1.0"
description = "ProffAgenten – Bedriftsinformasjon fra norske registre via Azure AI Foundry"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Azure AI Foundry
    "azure-ai-projects>=1.0.0",
    "azure-identity>=1.17.0",

    # HTTP
    "httpx>=0.27.0",

    # Word-eksport
    "python-docx>=1.1.0",

    # Config / env
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # CLI
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
proff = "proff.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
